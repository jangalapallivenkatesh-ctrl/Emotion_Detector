<!DOCTYPE html>
<html>
<head>
<title>Signup</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#e3f2f5,#d4e4ec);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    background:white;
    padding:50px;
    width:420px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}
h2{
    text-align:center;
    margin-bottom:30px;
    color:#1f3b4d;
}
input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border-radius:6px;
    border:1px solid #ccc;
}
button{
    width:100%;
    padding:12px;
    background:#1f7a8c;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
}
button:hover{opacity:0.9;}
a{
    color:#1f7a8c;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>
<body>
<div class="card">
<h2>Create Account</h2>
<form method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="text" name="phone" placeholder="Phone Number" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Signup</button>
</form>
<br>
<center><a href="/login">Already have account? Login</a></center>
</div>
</body>
</html>
